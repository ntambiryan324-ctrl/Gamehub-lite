name: Deploy Steam sign-in callback page

on:
  push:
    branches:
      - main
    paths:
      - "docs/steam-auth.html"
      - ".github/workflows/deploy-steam-auth-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: steam-auth-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out callback page
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload callback site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy callback site
        id: deployment
        uses: actions/deploy-pages@v4
