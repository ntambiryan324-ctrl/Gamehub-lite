name: Build and validate PocketWin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - antutu
          - ludashi
          - all
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: pocketwin-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and validate PocketWin APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'standard' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Verify PocketWin Android desktop sources
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/winlator/cmod/PocketWinDesktopActivity.java
          test -f app/src/main/java/com/winlator/cmod/PocketWinBrowserActivity.java
          test -f app/src/main/assets/pocketwin_desktop/index.html
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/assets/container_pattern_common.tzst
          test -f app/src/main/cpp/gladiorenderer/CMakeLists.txt
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'com.winlator.cmod.PocketWinDesktopActivity' app/src/main/AndroidManifest.xml
          grep -q 'category.HOME' app/src/main/AndroidManifest.xml
          if grep -q 'pocketwin_shell.exe' app/src/main/java/com/winlator/cmod/XServerDisplayActivity.java; then
            echo "The obsolete Wine-managed PocketWin shell is still referenced."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build selected APK flavor
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            debug) CAP_TYPE=Debug ;;
            release) CAP_TYPE=Release ;;
            *) echo "Unsupported build type: $BUILD_TYPE"; exit 1 ;;
          esac

          case "$FLAVOR" in
            standard) CAP_FLAVOR=Standard ;;
            antutu) CAP_FLAVOR=Antutu ;;
            ludashi) CAP_FLAVOR=Ludashi ;;
            all) CAP_FLAVOR=all ;;
            *) echo "Unsupported flavor: $FLAVOR"; exit 1 ;;
          esac

          if [ "$CAP_FLAVOR" = all ]; then
            ./gradlew ":app:assemble${CAP_TYPE}" --no-daemon --stacktrace
          else
            ./gradlew ":app:assemble${CAP_FLAVOR}${CAP_TYPE}" --no-daemon --stacktrace
          fi

      - name: Validate APK contents and launcher
        run: |
          set -euo pipefail
          mapfile -d '' APK_FILES < <(find app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APKs were produced."
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for apk in "${APK_FILES[@]}"; do
            echo "Validating $apk"
            unzip -tq "$apk"
            BADGING="$("$AAPT" dump badging "$apk")"
            PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            ACTIVITY="$(printf '%s\n' "$BADGING" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")"

            test -n "$PACKAGE" || { echo "Package name missing: $apk"; exit 1; }
            test "$ACTIVITY" = "com.winlator.cmod.PocketWinDesktopActivity" || {
              echo "Unexpected or missing PocketWin desktop launcher in $apk: $ACTIVITY"
              exit 1
            }

            APK_ENTRIES="$(unzip -Z1 "$apk")"
            printf '%s\n' "$APK_ENTRIES" | grep -q '^lib/arm64-v8a/[^/]*\.so$' || {
              echo "No ARM64 native libraries found in $apk"
              exit 1
            }
            printf '%s\n' "$APK_ENTRIES" | grep -q '^assets/imagefs\.tzst$' || {
              echo "Required Windows runtime filesystem image is missing from $apk"
              exit 1
            }
            printf '%s\n' "$APK_ENTRIES" | grep -q '^assets/pocketwin_desktop/index\.html$' || {
              echo "PocketWin native desktop interface is missing from $apk"
              exit 1
            }
            echo "APK structure OK: $PACKAGE / $ACTIVITY"
          done

      - name: Publish validated PocketWin APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketwin-${{ env.FLAVOR }}-${{ env.BUILD_TYPE }}-validated
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
